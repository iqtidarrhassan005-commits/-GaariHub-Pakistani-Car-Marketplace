<!DOCTYPE html>
<!-- Part 1 - HTML structure: header, hero search filters, listing grid, detail + post-ad modals. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GaariHub – Buy &amp; Sell Cars in Pakistan</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Gaari<span>Hub</span> 🚗</h1>
<nav><button onclick="toggleSaved()" id="savedBtn">♥ Saved (0)</button><button onclick="toggleTheme()">◐ Theme</button><button class="p" onclick="openPost()">+ Post Free Ad</button></nav></header>
<section class="hero"><div style="max-width:1100px;margin:0 auto">
<h2>Find your next car in Pakistan</h2><p>Search thousands of used cars and bikes from Karachi to Peshawar.</p>
<div class="tabs"><button class="on" data-t="car" onclick="setType('car')">Cars</button><button data-t="bike" onclick="setType('bike')">Bikes</button></div>
<div class="filters">
<select id="fMake" onchange="render()"></select><select id="fCity" onchange="render()"></select>
<select id="fPrice" onchange="render()"><option value="0">Any price</option><option value="1000000">Up to 10 lakh</option><option value="3000000">Up to 30 lakh</option><option value="6000000">Up to 60 lakh</option><option value="10000000">Up to 1 crore</option></select>
<select id="fYear" onchange="render()"><option value="0">Any year</option><option>2022</option><option>2019</option><option>2015</option><option>2010</option></select>
<input id="fQ" placeholder="Search e.g. Corolla" oninput="render()"></div></div></section>
<main><div class="bar"><b id="count"></b><select id="sort" onchange="render()"><option value="new">Newest listed</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option><option value="yr">Model year</option></select></div>
<div class="grid" id="grid"></div></main>
<footer>© 2026 GaariHub – demo marketplace. Listings are sample data.</footer>

<div class="modal" id="m1" onclick="if(event.target===this)closeM()"><div class="box" id="detail"></div></div>
<div class="modal" id="m2" onclick="if(event.target===this)closeM()"><div class="box">
<h3 style="margin-top:0">Post your ad</h3>
<div class="row"><div><label>Make</label><input id="pMake" placeholder="Toyota"></div><div><label>Model</label><input id="pModel" placeholder="Corolla GLi"></div></div>
<div class="row"><div><label>Year</label><input id="pYear" type="number" placeholder="2018"></div><div><label>Price (PKR)</label><input id="pPrice" type="number" placeholder="4500000"></div></div>
<div class="row"><div><label>City</label><select id="pCity"></select></div><div><label>Mileage (km)</label><input id="pKm" type="number" placeholder="60000"></div></div>
<div class="row"><div><label>Phone</label><input id="pPhone" placeholder="0300-1234567"></div><div><label>Type</label><select id="pType"><option value="car">Car</option><option value="bike">Bike</option></select></div></div>
<p class="mut" id="pErr" style="color:#d33"></p>
<button class="p" onclick="submitAd()">Publish ad</button> <button onclick="closeM()">Cancel</button></div></div>

<script src="js/data.js"></script>
<script src="js/listings.js"></script>
<script src="js/modals.js"></script>
</body>
</html>
